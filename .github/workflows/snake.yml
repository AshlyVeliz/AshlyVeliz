# Guarda este archivo en tu repo AshlyVeliz/AshlyVeliz como:
#   .github/workflows/snake.yml
# Genera una serpiente rosada que "se come" tus contribuciones, cada 12 horas.

name: Serpiente rosada 🐍💖

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generar serpiente
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-pink.svg?palette=github-light&color_snake=#DB2777&color_dots=#fde7f1,#fbcfe8,#f9a8d4,#f472b6,#db2777
            dist/snake-pink-dark.svg?palette=github-dark&color_snake=#FF69B4&color_dots=#2a1020,#5c1a3f,#9d2463,#e0479b,#ffb6c1

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
